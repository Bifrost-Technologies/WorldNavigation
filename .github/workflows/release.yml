name: Package and upload public addon
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify install package
        id: package
        run: python scripts/release.py
      - name: Save install package
        uses: actions/upload-artifact@v4
        with:
          name: install-package
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
      - name: Upload to CurseForge
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION_IDS: ${{ vars.CF_GAME_VERSION_IDS }}
        run: python scripts/release.py --upload
      - name: Publish GitHub download
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          RELEASE_TYPE: ${{ steps.package.outputs.release_type }}
        shell: bash
        run: |
          flags=(--prerelease --latest=false)
          if [[ "$RELEASE_TYPE" == release ]]; then flags=(--prerelease=false --latest); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "$CHECKSUM" --clobber
            gh release edit "$RELEASE_TAG" "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" "$CHECKSUM" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "Installable addon ZIP and SHA-256 checksum. Source: $GITHUB_SHA. Submitted to CurseForge; moderation may still be pending." "${flags[@]}"
          fi
